# -----------------------------------------------------
# General window layout and colors
# name: "Default"
# -----------------------------------------------------

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = $primary $on_primary 90deg
    col.inactive_border = $on_primary
    layout = scrolling
    resize_on_border = true
}

scrolling {
    column_width = 0.8
}
