# -----------------------------------------------------
# Key bindings
# name: "Custom"
# -----------------------------------------------------

# SUPER KEY
$mainMod = SUPER
$launchMod = $mainMod shift
$killMod = $mainMod control shift
$focusMod = $mainMod
$ctrlMod = $mainMod control
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/ml4w/scripts



$notibrightness=$HYPRSCRIPTS/notishort.sh   'brightness'
$notigamma=$HYPRSCRIPTS/notishort.sh        'gamma'
$notikbbrightness=$HYPRSCRIPTS/notishort.sh 'kbbrightness'
$notiobsaudio=$HYPRSCRIPTS/notishort.sh     'obsaudio'
$notitoggleaudio=$HYPRSCRIPTS/notishort.sh  'toggleaudio'
$notitogglemic=$HYPRSCRIPTS/notishort.sh    'togglemic'
$notivolume=$HYPRSCRIPTS/notishort.sh       'volume'
$notizoom=$HYPRSCRIPTS/notishort.sh         'zoom'
$to1dp=xargs printf '%.1f'

$activeclass=hyprctl activewindow -j | jq -r '.initialClass'
$activepid=hyprctl activewindow -j | jq -r '.pid'
$discordClass=ArmCord|WebCord|com.discordapp.Discord|discord|vesktop
$getvolume=wpctl get-volume @DEFAULT_SINK@ | sed -r -e 's/Volume: | \[MUTED\]//g'
$movefloating=grep -q 'true' <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
$toggleaudio=pactl set-sink-mute @DEFAULT_SINK@ toggle && $notitoggleaudio "$([[ `pactl get-sink-mute @DEFAULT_SINK@` = "Mute: yes" ]] && echo '   Muted' || echo '   Unmuted')"
$togglemic=pactl set-source-mute @DEFAULT_SOURCE@ toggle && $notitogglemic "$([[ `pactl get-source-mute @DEFAULT_SOURCE@` = "Mute: yes" ]] && echo '   Muted' || echo '   Unmuted')"
$topct=| jq -r '. * 100' | $to1dp
$zoomaction=hyprctl keyword cursor:zoom_factor
$zoomfloat=hyprctl getoption cursor:zoom_factor -j | jq -r '.float'



bindl  = , xf86audiomicmute,     exec, $togglemic           # Audio: Un/mute microphone
bindl  = , xf86audiomute,        exec, $toggleaudio         # Audio: Un/mute output
bindl  = , xf86audionext,        exec, playerctl next       # Audio: Next
bindl  = , xf86audiopause,       exec, playerctl play-pause # Audio: Pause
bindl  = , xf86audioplay,        exec, playerctl play-pause # Audio: Play
bindl  = , xf86audioprev,        exec, playerctl previous   # Audio: Previous
bindle = , xf86audiolowervolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && $notivolume '  '"$($getvolume $topct)"      # Audio: Decrease volume
bindle = , xf86audioraisevolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+ && $notivolume '  '"$($getvolume $topct)" # Audio: Increase volume

bindle = alt, xf86monbrightnessdown, exec, hyprctl hyprsunset gamma -10 && $notigamma '  Gamma: '"$(hyprctl hyprsunset gamma | $to1dp)" # Brightness: Decrease display gamma
bindle = alt, xf86monbrightnessup,   exec, hyprctl hyprsunset gamma +10 && $notigamma '  Gamma: '"$(hyprctl hyprsunset gamma | $to1dp)" # Brightness: Increase display gamma
bind   = ,    code:237,              exec, brightnessctl -d smc::kbd_backlight s -10 && $notikbbrightness '  Brightness: '"$(brightnessctl -d smc::kbd_backlight g | sed $topct)" # Brightness: Decrease keyboard intensity
bind   = ,    code:238,              exec, brightnessctl -d smc::kbd_backlight s +10 && $notikbbrightness '  Brightness: '"$(brightnessctl -d smc::kbd_backlight g | sed $topct)" # Brightness: Increase keyboard intensity
bindle = ,    xf86monbrightnessdown, exec, brightnessctl -q s -10% && $notibrightness '  Brightness: '"$(brightnessctl g | sed $topct)" # Brightness: Decrease display intensity
bindle = ,    xf86monbrightnessup,   exec, brightnessctl -q s +10% && $notibrightness '  Brightness: '"$(brightnessctl g | sed $topct)" # Brightness: Increase display intensity

bind   = , xf86lock,       exec, hyprlock # Lock
bind   = , xf86calculator, exec, ~/.config/ml4w/settings/calculator.sh # App: Calculator
bind   = , xf86tools,      exec, qs ipc call settings toggle           # App: ML4W Settings

bind   = $focusMod alt, home,  exec, wl-kbptr -o modes=floating -o mode_floating.source=detect # Mouse: Auto areas
bind   = $focusMod alt, next,  exec, wl-kbptr -o modes=split       # Mouse: Split areas
bind   = $focusMod,     home,  exec, wlrctl pointer click left     # Mouse: Left click
bind   = $focusMod,     next,  exec, wlrctl pointer click right    # Mouse: Right click
binde  = $focusMod alt, prior, exec, wlrctl pointer scroll  0  -10 # Mouse: Scroll left
binde  = $focusMod alt, end,   exec, wlrctl pointer scroll  0   10 # Mouse: Scroll right
binde  = $focusMod,     prior, exec, wlrctl pointer scroll  10  0  # Mouse: Scroll down
binde  = $focusMod,     end,   exec, wlrctl pointer scroll -10  0  # Mouse: Scroll up
binde  = $focusMod,     down,  exec, wlrctl pointer move  0   10   # Mouse: Down
binde  = $focusMod,     left,  exec, wlrctl pointer move -10  0    # Mouse: Left
binde  = $focusMod,     right, exec, wlrctl pointer move  10  0    # Mouse: Right
binde  = $focusMod,     up,    exec, wlrctl pointer move  0  -10   # Mouse: Up

bind   = $focusMod, V, exec, $SCRIPTS/ml4w-cliphist # Clipboard: Copy

bind   = $focusMod, M, sendshortcut, CTRL SHIFT, M, class:^($discordClass)$ # Discord: Un/mute

bind   = $launchMod,     escape,         exec, ~/.config/ml4w/settings/system-monitor.sh # App: System Monitor
bind   = $launchMod,     equal,          exec, ~/.config/ml4w/settings/calculator.sh     # App: Calculator
bind   = $launchMod,     grave,          exec, ~/.config/ml4w/settings/terminal.sh       # App: Terminal
bind   = $launchMod,     B,              exec, ~/.config/ml4w/settings/browser.sh        # App: Browser
bind   = $launchMod,     C,              exec, ~/.config/ml4w/settings/hyprpicker.sh     # App: Color Picker
bind   = $launchMod,     D,              exec, discord                                   # App: Discord
bind   = $launchMod,     E,              exec, ~/.config/ml4w/settings/filemanager       # App: File Manager
bind   = $launchMod,     N,              exec, ~/.config/ml4w/settings/editor.sh         # App: Editor
bind   = $launchMod,     S,              exec, qs ipc call sidebar toggle                # Widget: ML4W Sidebar
bind   = $launchMod,     Y,              exec, qs ipc call calendar toggle               # Widget: ML4W Calendar

bindl  = $launchMod alt, print,  exec, $HYPRSCRIPTS/screenshot.sh --instant      # Screenshot: All
bind   = $launchMod alt, space,  exec, $HYPRSCRIPTS/launcher.sh                  # Menu: CLI/Terminal Apps
bind   = $launchMod alt, G,      exec, $SCRIPTS/ml4w-wallpaper-app --random      # Wallpaper: Random
bind   = $launchMod,     comma,  exec, ~/.config/ml4w/settings/emojipicker.sh    # Menu: Emoji
bindl  = $launchMod,     print,  exec, $HYPRSCRIPTS/screenshot.sh                # Menu: Screenshot
bind   = $launchMod,     slash,  exec, $HYPRSCRIPTS/keybindings.sh               # Menu: Keybindings
bind   = $launchMod,     space,  exec, $HYPRSCRIPTS/launcher.sh                  # Menu: Desktop Apps
bind   = $launchMod,     tab,    exec, qs -p $HOME/.config/quickshell/overview ipc call overview toggle # Menu: Workspaces
bind   = $launchMod,     1,      exec, $HYPRSCRIPTS/screenshot.sh --instant      # Screenshot: All
bind   = $launchMod,     2,      exec, $HYPRSCRIPTS/screenshot.sh --instant      # Screenshot: Monitor
bind   = $launchMod,     3,      exec, $HYPRSCRIPTS/screenshot.sh --instant-area # Screenshot: Area
bind   = $launchMod,     4,      exec, $HYPRSCRIPTS/text-extractor.sh            # Screenshot: Extract Text
bind   = $launchMod,     5,      exec, $HYPRSCRIPTS/screenshot.sh                # Menu: Screenshot
bind   = $launchMod,     G,      exec, $SCRIPTS/ml4w-wallpaper-app               # Menu: Wallpaper
bind   = $launchMod,     L,      exec, qs ipc call power toggle                  # Menu: Logout/Power
bind   = $launchMod,     T,      exec, ~/.config/ml4w/themes/themes.sh           # Menu: Theme
bind   = $launchMod,     W,      exec, ~/.config/waybar/themeswitcher.sh         # Menu: waybar theme

bind   = $killMod alt, W,         exec, ~/.config/waybar/toggle.sh     # Toggle waybar
bind   = $killMod alt, V,         exec, $SCRIPTS/ml4w/ml4w-cliphist -d # Clipboard: Wipe
bind   = $killMod,     delete,    exec, $HYPRSCRIPTS/loadconfig.sh     # Reload hyprland
bind   = $killMod,     semicolon, exec, systemctl --user restart pipewire.service pipewire-pulse.service wireplumber.service # Restart pipewire
bindl  = $killMod,     D,         dpms, toggle                         # Toggle dpms
bind   = $killMod,     G,         exec, $HYPRSCRIPTS/gamemode.sh       # Toggle gamemode
bind   = $killMod,     L,         exec, hyprlock                       # Lock
bind   = $killMod,     Q,         forcekillactive                      # Kill focused window
bind   = $killMod,     W,         exec, ~/.config/waybar/launch.sh     # Reload waybar
bind   = $killMod,     V,         exec, $SCRIPTS/ml4w/ml4w-cliphist -d # Clipboard: Wipe

bind   = $focusMod alt, tab,        cyclenext, prev  # Focus: Previous window
bind   = $focusMod alt, down,       focusmonitor, +1 # Focus: Next monitor
bind   = $focusMod alt, left,       focusmonitor, -1 # Focus: Previous monitor
bind   = $focusMod alt, right,      focusmonitor, +1 # Focus: Next monitor
bind   = $focusMod alt, up,         focusmonitor, -1 # Focus: Previous monitor
bind   = $focusMod,     grave,      exec, kitten quick-access-terminal # Focus: Dropdown termina'
bind   = $focusMod,     H,          movefocus, l # Focus: Left
bind   = $focusMod,     J,          movefocus, d # Focus: Down
bind   = $focusMod,     K,          movefocus, u # Focus: Up
bind   = $focusMod,     L,          movefocus, r # Focus: Right
bind   = $focusMod,     1,          workspace, 1 # Focus: Workspace 1
bind   = $focusMod,     2,          workspace, 2 # Focus: Workspace 2
bind   = $focusMod,     3,          workspace, 3 # Focus: Workspace 3
bind   = $focusMod,     4,          workspace, 4 # Focus: Workspace 4
bind   = $focusMod,     5,          togglespecialworkspace # Focus: Special workspace
bind   = $focusMod,     0,          togglespecialworkspace # Focus: Special workspace
bind   = $focusMod,     tab,        cyclenext    # Focus: Cycle

binde  = $focusMod alt, minus,      exec, $zoomaction 1 && $notizoom '  1'                                                             # Display: Zoom reset
binde  = $focusMod alt, mouse_up,   exec, $zoomaction 1 && $notizoom '  1'                                                             # Display: Zoom reset
binde  = $focusMod,     equal,      exec, $zoomaction `$zoomfloat | jq -r '. + 0.1'` && $notizoom '  '"$($zoomfloat | $to1dp)"            # Display: Zoom in
binde  = $focusMod,     minus,      exec, $zoomaction `$zoomfloat | jq -r '[1, . - 0.1] | max'` && $notizoom '  '"$($zoomfloat | $to1dp)" # Display: Zoom out
binde  = $focusMod,     mouse_down, exec, $zoomaction `$zoomfloat | jq -r '. + 0.1'` && $notizoom '  '"$($zoomfloat | $to1dp)"            # Display: Zoom in
binde  = $focusMod,     mouse_up,   exec, $zoomaction `$zoomfloat | jq -r '[1, . - 0.1] | max'` && $notizoom '  '"$($zoomfloat | $to1dp)" # Display: Zoom out

bind   = $ctrlMod alt, Q, exec, kill $($activepid)             # Kill all processes of focused window
bind   = $ctrlMod,     J, layoutmsg, togglesplit               # Toggle split
bind   = $ctrlMod,     P, exec, $SCRIPTS/ml4w-toggle-float-pin # Toggle pin if floating
bind   = $ctrlMod,     Q, killactive                           # Close focused window
bind   = $ctrlMod,     W, togglefloating                       # Toggle floating
bind   = $ctrlMod alt, W, exec, $SCRIPTS/ml4w-toggle-allfloat  # Toggle floating for all windows

bind   = $ctrlMod alt, 1,     movetoworkspacesilent, 1          # Move window to workspace 1 (silent)
bind   = $ctrlMod alt, 2,     movetoworkspacesilent, 2          # Move window to workspace 2 (silent)
bind   = $ctrlMod alt, 3,     movetoworkspacesilent, 3          # Move window to workspace 3 (silent)
bind   = $ctrlMod alt, 4,     movetoworkspacesilent, 4          # Move window to workspace 4 (silent)
bind   = $ctrlMod alt, 5,     movetoworkspacesilent, special    # Move window to special workspace (silent)
bind   = $ctrlMod alt, 0,     movetoworkspacesilent, special    # Move window to special workspace (silent)
bind   = $ctrlMod alt, down,  movecurrentworkspacetomonitor, +1 # Move workspace to next monitor
bind   = $ctrlMod alt, left,  movecurrentworkspacetomonitor, -1 # Move workspace to previous monitor
bind   = $ctrlMod alt, right, movecurrentworkspacetomonitor, +1 # Move workspace to next monitor
bind   = $ctrlMod alt, up,    movecurrentworkspacetomonitor, -1 # Move workspace to previous monitor
bind   = $ctrlMod,     1,     movetoworkspace, 1                # Move window to workspace 1
bind   = $ctrlMod,     2,     movetoworkspace, 2                # Move window to workspace 2
bind   = $ctrlMod,     3,     movetoworkspace, 3                # Move window to workspace 3
bind   = $ctrlMod,     4,     movetoworkspace, 4                # Move window to workspace 4
bind   = $ctrlMod,     5,     movetoworkspace, special          # Move window to special workspace
bind   = $ctrlMod,     0,     movetoworkspace, special          # Move window to special workspace
binde  = $ctrlMod,     H,     exec, $movefloating -20  0  || hyprctl dispatch movewindow l # Move window left
binde  = $ctrlMod,     L,     exec, $movefloating  20  0  || hyprctl dispatch movewindow r # Move window right
binde  = $ctrlMod,     K,     exec, $movefloating  0  -20 || hyprctl dispatch movewindow u # Move window up
binde  = $ctrlMod,     J,     exec, $movefloating  0   20 || hyprctl dispatch movewindow d # Move window down

bind   = $ctrlMod alt, return,    fullscreen, 0       # Fullscreen window
bind   = $ctrlMod,     return,    fullscreen, 1       # Maximize window
binde  = $ctrlMod alt, H,         resizeactive, -20 0 # Resize window left
binde  = $ctrlMod alt, J,         resizeactive, 0 20  # Resize window down
binde  = $ctrlMod alt, K,         resizeactive, 0 -20 # Resize window up
binde  = $ctrlMod alt, L,         resizeactive, 20 0  # Resize window right
bindm  = $ctrlMod,     mouse:272, movewindow          # Hold to move window
bindm  = $ctrlMod,     mouse:273, resizewindow        # Hold to resize window

bind   = $ctrlMod alt, semicolon, exec, $HYPRSCRIPTS/obsaudio-remove.zsh "$($activepid)" && $notiobsaudio '󱡫  '"$($activeclass)"'    obsaudio' # Audio: Remove process from obsaudio
bind   = $ctrlMod,     semicolon, exec, $HYPRSCRIPTS/obsaudio-move.zsh   "$($activepid)" && $notiobsaudio '󱡫  '"$($activeclass)"'    obsaudio' # Audio: Move process to obsaudio

